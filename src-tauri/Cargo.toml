[package]
name = "zoltanstudios-testtag"
version = "2.6.0"
description = "ZoltanStudios Test and Tag compliance records"
authors = ["ZoltanStudios"]
edition = "2021"
rust-version = "1.77"

# Mobile targets build the app as a library and link it into the native shell.
[lib]
name = "zoltanstudios_testtag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
