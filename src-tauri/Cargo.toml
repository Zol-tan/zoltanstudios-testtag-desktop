[package]
name = "zoltanstudios-testtag"
version = "2.6.0"
description = "ZoltanStudios Test & Tag compliance records"
authors = ["ZoltanStudios"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
