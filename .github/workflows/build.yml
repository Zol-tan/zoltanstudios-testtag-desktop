name: Build Windows App

# Runs when you push a version tag (v2.6.0, v2.6.1, ...) and can also be
# started by hand from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # Build only the NSIS installer first. NSIS is more forgiving than WiX
      # and gets us a working .exe even if the MSI path has issues.
      - name: Build NSIS installer
        run: tauri build --verbose --bundles nsis

      # MSI via WiX. Allowed to fail so a WiX problem doesn't block the
      # release - the NSIS installer above is a complete, usable installer.
      - name: Build MSI installer
        id: msi
        continue-on-error: true
        run: tauri build --verbose --bundles msi

      # If WiX failed, print the generated XML and run candle by hand so the
      # real parser error appears in the log instead of a bare exit code.
      - name: Diagnose WiX failure
        if: steps.msi.outcome == 'failure'
        shell: pwsh
        continue-on-error: true
        run: |
          $wxs = Get-ChildItem -Path src-tauri/target/release/wix -Recurse -Filter main.wxs -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wxs) {
            Write-Host "===== main.wxs ====="
            Get-Content $wxs.FullName
            $candle = "$env:LOCALAPPDATA\tauri\WixTools314\candle.exe"
            if (Test-Path $candle) {
              Write-Host "===== candle.exe output ====="
              & $candle -nologo -arch x64 -out "$env:TEMP\out.wixobj" $wxs.FullName 2>&1 | Write-Host
            }
          } else {
            Write-Host "main.wxs was not generated."
          }

      # The bundler writes to a versioned path, so collect the artefacts
      # into one predictable folder before uploading.
      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName -Destination out -Force }
          $found = Get-ChildItem out -ErrorAction SilentlyContinue
          if (-not $found) { Write-Error "No installers were produced."; exit 1 }
          $found | ForEach-Object { Write-Host $_.Name ("{0:N1} MB" -f ($_.Length/1MB)) }

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoltanStudios-TestTag-Windows
          path: out/*

      # When triggered by a tag, also publish a Release so there's a
      # permanent download link rather than a 90-day artifact.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
